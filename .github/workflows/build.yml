# 빈티지톡 상품필터: 15분마다 분류별 상품 목록 파일을 만들어 GitHub Pages에 올립니다.
# 보통은 2~3분(바뀐 것만), 하루 1번은 전체 다시 받기(약 15분). 비밀값 없음.
# 11/23: 플러스(plus/)·오케이(ok/)도 같은 실행에서 만듦 — 사이트는 통째로 올라가서 세 가게를 한 번에 만들어야 서로 안 지워짐.
#        플러스·오케이가 실패해도 톡은 올라가게(continue-on-error). 둘은 '빈티지 쇼핑몰 자동화' 앱 번호로 분류를 읽고 태그는 안 받음.
name: build-index
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "전체 다시 받기 (1)"
        required: false
        default: "0"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 목록 파일 만들기
        id: build
        run: node build.mjs
        env:
          OUT_DIR: out
          FULL: ${{ github.event.inputs.full }}
      - name: 플러스 목록 파일 만들기
        continue-on-error: true
        timeout-minutes: 15
        run: node build.mjs
        env:
          OUT_DIR: out
          SUB: plus
          MALL: k2sun2000
          CAFE24_CLIENT_ID: uWRetGTjWq9Kz3aMNa32ZE
          TAGS: "0"
          FULL: ${{ github.event.inputs.full }}
      - name: 오케이 목록 파일 만들기
        continue-on-error: true
        timeout-minutes: 15
        run: node build.mjs
        env:
          OUT_DIR: out
          SUB: ok
          MALL: korshin7
          CAFE24_CLIENT_ID: uWRetGTjWq9Kz3aMNa32ZE
          TAGS: "0"
          FULL: ${{ github.event.inputs.full }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
      # GitHub는 저장소에 60일 동안 변화가 없으면 자동 실행을 멈춥니다 → 전체 실행 때(하루 1번) 기록 한 줄을 남겨 계속 돌게 함
      - name: 계속 돌게 기록 남기기
        if: steps.build.outputs.full == '1'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last_full.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_full.txt
          git commit -m "전체 실행 기록" || exit 0
          git push
